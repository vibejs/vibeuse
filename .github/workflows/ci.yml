name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Library, documentation and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify types, coverage, production builds and packed consumer
        run: pnpm check
      - name: Record diagnostic benchmarks
        run: pnpm bench
      - name: Check generated files are current
        run: git diff --exit-code
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-reports
          path: |
            coverage/
            artifacts/*-report.json
            artifacts/benchmark.json
            artifacts/*.png
          retention-days: 14
